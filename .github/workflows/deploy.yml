name: Deploy VoxelTools to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check dependency lockfile
        id: lockcheck
        run: |
          if [ -f package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          if [ "${{ steps.lockcheck.outputs.present }}" = "true" ]; then
            npm ci
          else
            npm install
          fi

      - name: Commit generated lockfile
        if: steps.lockcheck.outputs.present == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add dependency lockfile"
          git push

      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-lockfile
          path: package-lock.json
          if-no-files-found: error

      - name: Run unit tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build VoxelTools
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
